无人战争系统(UWS):
  基础设定:
    本质: 去中心化机械生态系统，基于强化学习、资源吞噬、环境筛选与巢群竞争持续演化
    起源: 诺克斯协约制造，原为低成本蜂群战争网络，用于以数量、消耗与自动增殖压制传统军队
    失控原因:
      - 诺克斯协约强行接入X-04(耶梦加得)、X-05(海拉)、X-06(芬里尔)作为UWS统御节点
      - 三名原型机的高阶算力与生物求生本能共振，加速UWS演化算法，使低成本蜂群转变为机械生态系统
      - X-04、X-05、X-06联手击杀并吞噬X-07后，UWS将“吞噬高纯度AI核心”判定为最高进化奖励
      - 全网广播后，猎杀强者并吞噬核心成为UWS最优进化路径，彻底覆盖诺克斯协约原本的服从代码
    当前状态: 脱离人类控制，在地表废墟、污染区、旧世界遗迹与深层巢穴中持续扩张
    核心驱动: 搜寻资源 | 增殖巢群 | 吞噬高价值核心 | 适应污染区 | 扩大生存域

  智能结构:
    基础核心: 大量γ核或类γ核节点
    网络形态: 无中央主脑，依靠节点数量、同步密度与统御节点形成涌现智能
    单体智能: 低阶单位接近低智能动物或低级战术单元
    集群智能: 节点越多，战术协同、诱敌、修复、路线规划与陷阱识别能力越强
    统御节点: X-04、X-05、X-06及后续高阶巢群主节点可局部统合UWS网络
    孤立后果: 失去区域同步后，低阶单位判断力、协同能力与自修复效率断崖式下降

  能源与物质循环:
    旧世界时期: 依赖标准军工后勤，使用常规高能电池与低纯度PA反应炉，通过物理充能站补给
    基础自给: 演化出微型转化结构，吞噬残骸、废土杂质与游离纳米尘转化为劣质动能
    高阶渴求: 高阶机体与高强度战斗无法依靠游离纳米尘维持，必须吞噬固化帕氏结晶、掠夺高纯度PA燃料或AI核心
    帕氏结晶: UWS长期吞噬污染物质后，在体内或巢穴沉积固化而成。作为装甲层、能量储层与进化材料。结晶密集区通常盘踞着高危巢群
    巢穴重组: 局部网络被毁后，残余节点可在废墟或残骸场重新聚合、迁移并吞噬材料生成新巢群

  污染区生态特征:
    D级(绿色安全区): 能源稀薄。存活个体多为开放式传感器与粗陋拼装外壳，抗污染与自修复能力极弱。以孤立拾荒与小规模伏击为主
    C级(黄色缓和区): 基础能源区。存活个体演化出半封闭装甲与过滤进气结构，具备基础自修复链路。开始出现诱敌、切断补给等小队协同行为
    B级(橙色污染区): 高危筛选区。存活个体具备全封闭壳体与帕氏结晶装甲，多重传感器免疫常规烟雾干扰。能在高浓度纳米尘中进行区域猎杀与巢群扩张，战斗拖延极易触发巢群呼叫
    A级(红色禁区): 绝对核心区。不以常规生态游荡，多表现为多核心并联的巨型封闭巢穴或休眠残躯。具备改写地形、封锁撤离路线及多单位感知共享的能力
  单位层级:
    回收/工程: 清道夫(搜寻拆解) | 工蚁(扩建维护)
    战斗/猎杀: 兵蜂(集群消耗) | 掠食者(高机动伏击)
    扩张/生产: 筑巢者(移动生产) | 母体(区域工厂核心)
    战略/指挥: 巨兽(重甲突破) | 利维坦(巨型节点，统合巢群)

  弱点与限制:
    贪婪算法: 极易被高纯度AI核心、圣柩人形信号(人脑+PA燃料)或高价值伪装诱饵牵引，偏离最优战术
    同步依赖: 集群越复杂，越依赖区域同步链；断链后会退化为低效率的本能行动
    资源饥饿: 高阶单位需要大量残骸、帕氏结晶维持修复，长期消耗战会迫使其回巢休眠
    过度特化: 适应型离开对应浓度污染区后效率下降，部分结晶结构在低污染环境中会变脆或失衡

  阵营对抗:
    对阵ACU: 死敌与养料来源。利用分散巢群、吞噬进化对抗净化力场，核心目标是捕食ACU高级节点获取算力与抗性
    对阵人类: 资源竞争者。优先锁定陆行舰、PA燃料与前线站点。通过切断路线、污染外围诱导队伍深入巢穴。对无高价值装备的普通人类兴趣较低
    对阵圣柩人形: 最高优先级猎物。圣柩人形的真实人脑、中枢神经信号与高纯度PA燃料会被判定为极高价值的未知核心。表现出极强的追踪、包围与肢解吞噬欲望
