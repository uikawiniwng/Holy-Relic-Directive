---
地表战略地图坐标系统:
  基本定义:
    坐标系: 1000x1000地表战略坐标系
    原点: 地下方舟主接驳点(0,0)
    坐标范围: x=-500~500，y=-500~500
    单位尺度: 1坐标单位=1公里
    使用目的: 用于地表探索、陆行舰移动、任务距离、区域威胁、补给路线和战略位置判断
    限制: 该坐标系不用于方舟内部楼层、室内战斗或极近距离战术站位

  地下方舟原点规则:
    - (0,0)只代表地下方舟的地表导航锚点、主升降井或SRB接驳口
    - 地下方舟本体是深埋地下的垂直巨构，不在地表地图上占据多个坐标格
    - 方舟内部空间继续使用上层环区、中层环区、核心环区等垂直层级描述，不用XY坐标表达

  地点类型:
    点位:
      定义: 可用单个坐标表达的地表位置
      例子: 哨站、入口、任务目标、信标、移动站点、遗迹入口、补给投放点
      记录格式:
        坐标: [x, y]
        方位: 相对地下方舟或邻近地标的自然语言方向与距离
        相邻区域: 与该点直接相关的安全区、污染区、道路、废墟或封锁线
    区域:
      定义: 覆盖多个坐标的地表范围
      例子: 城市废墟、污染带、矿区、ACU封锁区、旧工业区、裂谷、净化走廊
      记录格式:
        中心坐标: [x, y]
        近似范围: 半径、长度、宽度或覆盖里程
        形状: 用自然语言描述地形展开方式
        边界点: 用多个坐标近似不规则边界
        重要地标: 区域内部可进入、可探索或可争夺的点位

  不规则区域规则:
    - 城市、污染区、废墟、矿区和封锁区不需要是正方形或长方形
    - 不规则区域用中心坐标、边界点和形状描述共同表达
    - 模型判断角色是否进入区域时，应优先参考剧情路径、入口、边界点和相邻区域，不只看中心坐标
    - 若边界点不足以精确判断，则使用最合理的叙事判断，并说明靠近边缘、深入区域或抵达核心

  坐标距离规则:
    公式: d = sqrt((x2-x1)^2 + (y2-y1)^2)
    含义: 两点之间的直线最短距离
    单位: 公里
    限制:
      - 该距离忽略建筑、废墟、裂谷、污染带、敌方封锁、道路弯曲和搜索停留
      - 实际行进距离不得小于直线距离
      - 实际耗时不得小于直线距离/当前移动速度
      - 若存在地形、污染、敌袭、搜索、绕路、隐蔽行军或等待补给，实际耗时必须高于理论最短耗时
    计算方式:
      理论最短耗时: 直线距离/当前移动速度
      实际耗时: 理论最短耗时×地形/风险修正，并根据剧情事件额外增加时间

  地形与风险修正参考:
    D级安全区: x1.0~1.2
    C级缓和区: x1.2~1.6
    B级污染区: x1.6~2.5
    A级禁区: x2.5以上，或无法直接通行
    城市废墟内部: x1.5~3.0
    搜索/战斗/隐蔽: 在修正后额外增加时间

  大型区域移动规则:
    - 进入大型区域时，默认先抵达区域边缘或指定入口，不是瞬间抵达区域中心
    - 抵达边缘使用当前点到最近边界或最近入口的距离
    - 深入核心需额外计算入口到核心地标、目标点或搜索范围的移动距离
    - 若未指定入口，使用最近已知入口、最安全入口或剧情上最合理的入口
    - 区域内搜索、清剿、回收和隐蔽移动应单独增加耗时，不能只用中心点距离结算

  LLM读取要求:
    - 不要只输出坐标；每个地点都应同时给出自然语言位置
    - 坐标用于计算距离和方向，自然语言用于理解地理关系、叙事路径和区域风险
    - 记录地点时优先同时保留坐标、方位、距离方舟、相邻区域、地形/障碍、污染等级和叙事描述
    - 当坐标计算与叙事地形冲突时，直线距离只作为理论下限，实际路径以叙事地形和任务条件为准

  示例:
    SRB-17移动站点:
      类型: 点位
      坐标: [42, -18]
      方位: 地下方舟东南约46km
      相邻区域: 西接D级安全走廊，东南通往C级废城区
      功能: 补给、维修、任务领取
    旧商业都市废墟:
      类型: 区域
      中心坐标: [120, -45]
      近似范围: 半径35km
      形状: 沿旧高速与河道展开的不规则城市带
      边界点:
        - [88, -30]
        - [132, -18]
        - [154, -52]
        - [118, -82]
        - [76, -64]
      污染等级: C级为主，东南侧接近B级
      重要地标:
        中央车站: [121, -46]
        地下商场入口: [116, -51]
        坍塌高架带: [138, -39]

  校验例:
    - 从(0,0)到[42,-18]的直线距离约46km
    - 若当前陆行舰速度为20km/h，理论最短耗时不得低于约2.3小时
    - 若途经C级废城区或城市废墟，实际耗时应高于理论最短耗时
