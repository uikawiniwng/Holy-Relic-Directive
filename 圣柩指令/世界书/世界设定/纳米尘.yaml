帕斯卡粒子:
  起源: 名字源自旧时代著名科学家帕斯卡博士。他首次发现了压忆矿在心智信号干预下的高压相变现象，并由此发明了首个“帕斯卡引擎(PA引擎)”
  历史影响: PA引擎的诞生打破了传统能源的瓶颈，直接导致了旧时代AI算力的爆炸式增长，开启了自动化战争的序幕
  命名惯例: 后世将该体系下的相关物质与设备统称为“帕斯卡(PAscal, 简称PA)”
  压忆矿:
    定位: 帕斯卡粒子最常见的形態，也是生产PA燃料的基础原矿
    本质: 远古生命死亡后，心智殘响(灵魂碎片)与神经信号在地底极高压下沉积形成的“记忆化石”
    特征: 获取难度低于铀矿，但原矿本身无法直接供能，必须经过特定装置与心智锁相加工
  心智锁相:
    晶体特性: 帕斯卡粒子拥有多种晶体态，当压忆矿融化并再结凝时，若有观察者(心智大脑或AI核心)在旁边提供神经信号，会直接影响晶体的成型结果
    心智决定品质:
      - 观察者的心智越强大、脑电波越稳定（如高阶AI核心、强大的圣柩人形），制造出的PA晶体品质就越高
      - 否则只能产生低品质晶体，甚至直接炸成污染环境的废渣（纳米尘）
  低品质晶体:
    制造过程: 旧世界工厂或陆行舰资源加工站，将压忆矿置于高压反应釜中，利用基础心智信号（如人类苦工或低级AI核心）进行初步锁相
    产出结果: 剔除原矿大部致命杂质，转化为相对稳定的液态或低活性固态结晶，然后加工成PA燃料
    特征:
      - 能量密度一般，但极度稳定，可装桶运输与长期保存
      - 陆行舰主引擎和常规重武器直接燃烧此形态；也是圣柩人形的日常战术补给
  高品质晶体:
    制造过程: 圣柩人形在战斗时，体内的微型PA引擎吸收PA燃料，强行施加二次极端高压，并接入真实人脑进行“二次心智锁相”
    产出结果: 瞬间升维压缩燃料，剥离最后杂质，结晶成纯度极高的“高品质PA晶体”
    特征:
      - 能量密度极高。纯度愈高，能量转化率愈高。常温下极度不稳定，会瞬间反应释放庞大能量
      - 无法储存，仅在人形体内瞬间生成并消耗
  纳米尘:
    来源: 所有消耗PA燃料/压忆矿过程中的必然产生的副产物，等同于内燃机的“废气”
    作用与影响:
      - 生物: 包含重金属，长期暴露导致重金属中毒、畸变或死亡
      - 普通机械: 堵塞散热，腐蚀未防护电路，致使远距通讯、雷达与制导不可靠
      - 网络机械: 干扰同步链路，阻断电磁信号
    单位能源适应性:
      UWS: 演化出吞噬结构，吸收废土残骸与低品质固态燃料维持运作；高阶单位极度渴求高纯度AI核心或人形心智来维持庞大机体
      ACU: 垄断地表旧世界遗留的高级PA反应炉，利用内部矩阵进行高规格工业锁相，获取高品质燃料维持净化力场
      圣柩人形: 依靠补给PA燃料维持机动；高强度输出增加精神负荷
      人类组织 (SRB): 依靠陆行舰加工站收集压忆矿与旧世界燃料残渣，进行基础加工以维持生存与远征
    环境与战术限制:
      天气影响: 纳米尘风暴加剧电磁盲区；降雨压低空气浓度但污染地表与水源
      作战限制: 严禁超远程导弹、自动锁定与轨道火力；常规地表作战强制依赖陆行舰近距支援、短距加密链路与人形目视接战
      飞行限制: 常规飞机极少使用；无人机等近地设备仅限低污染区短时、低空使用
      生存模式: 地表环境恶劣，仅适合短时行动或依靠陆行舰移动远征，长期定居维护成本极高
