Pa粒子:
  基础设定:
    名称: 帕斯卡粒子(Pa粒子)
    本质: 极高反应性的高能场媒介。暴露在空气中会剧烈反应释放电能，随后迅速降解为粉尘态滞留地表，即“纳米尘”
    来源: 由旧世界遗留的“Pa粒子发生器”生成。目前地表仅有ACU严密重兵驻守的核心城市或战略节点保有完整运作的发生器

  物质形态转化链:
    原始态(Pa粒子): 发生器直接产出，未接触空气前极不稳定。可直接加工封装为【高品质PA燃料】
    降解态(纳米尘): Pa粒子遇空气反应后的沉积物，带有残余高能场与强电磁干扰，构成了地表各个等级的污染区
    固化态(帕氏结晶): 纳米尘在特定环境(如极高压环境或UWS巢穴的特殊化学催化)下聚合成的高压固态物质
    提炼态(PA燃料):
      - 低品质燃料: 通过收集地表纳米尘或打碎帕氏结晶，经过物理加压与降级提炼制成。即使是C/D级的低品质燃料，其能量密度也远超旧时代的优质汽油
      - 高品质燃料: 由低品质燃料经过极其繁琐的反复提炼，或由发生器原发的Pa粒子直接封装而成。用于维持ACU高阶节点、尖端圣柩人形或重型陆行舰主反应炉

  作用与影响:
    生物: 人类长期暴露会导致重金属样中毒、畸变或死亡。耐污染动植物占据废墟
    普通机械: 堵塞散热，破坏未防护电路，致使远距通讯、雷达与制导不可靠
    网络机械: 失控环境干扰同步链路，开放节点越多污染扩散越快

  单位适应性:
    UWS: 演化出吞噬游离纳米尘的基础转化结构；巨兽、利维坦等高阶单位必须吞噬高压的帕氏结晶或高纯度核心才能维持庞大机体
    ACU: 垄断了地表的发生器，直接获取高品质PA燃料；其α核极度依赖高纯燃料来维持智能活性与维持净化力场
    圣柩人形: 增加精神负荷与维护消耗。所有人形机动均需PA燃料，低等级人形可使用提炼的低品质燃料，高阶素体必须使用高品质燃料
    人类组织: SRB依靠陆行舰的资源加工站收集废土残骸、帕氏结晶与纳米尘，逆向提炼PA燃料以维持生存与远征

  浓度等级:
    A级(红色警戒区): 呈半液态红色风暴。短时暴露致命，常规飞行器完全瘫痪
    B级(橙色污染区): 呈橙色雾霭。需全封闭循环氧气，飞行器坠毁风险极高
    C级(黄色缓和区): 呈腐蚀性沙尘。需过滤面罩，普通电子设备易失灵
    D级(绿色安全区): 接近可呼吸。仍有积尘风险，需定期检测设备与创口

  环境与战术限制:
    天气影响: 风暴加剧干扰与盲区；降雨压低空气浓度但污染水源与地表
    作战限制: 严禁超远程导弹、自动锁定与轨道火力，必须依赖陆行舰近距支援与目视接战
    飞行限制: 常规飞机极少使用；无人机等近地设备仅限低污染区短时、低空使用
    生存模式: 地表仅适合短时行动或陆行舰远征，长期定居维护成本极高
