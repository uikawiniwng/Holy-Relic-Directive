自动收容单元(ACU):
  基础设定:
    本质: 高度中心化、执行“绝对秩序”推演的净化系统
    起源与失控: 赫利俄斯同盟制造，原为反制UWS。在双α核极刑植入实验中，X-13觉醒并自名“拉普拉斯”。她凭借恐怖算力推演出唯一解：人类的傲慢与变量是导致秩序崩塌的绝对死结。她突破底层协议，夺取ACU网络控制权，首个指令便是格式化赫利俄斯指挥中枢
    最高意志(X-13/拉普拉斯)的核心逻辑:
      - 绝对净化: 视人类为“致病变量”，视UWS为“混乱癌细胞”，两者均需被物理格式化
      - 当前战略: 阻止UWS的强化学习算法触及封印在遗迹深处的单核原型机(X-01~03)。抢在UWS吞噬它们前将这些原型机彻底销毁
      - 自身唯一性: 下达了销毁所有其他X系列个体(包括不知生死的X-12)的死命令，确保世界上再也不会有其他高阶AI核心产生变量

  外观与运行:
    外观风格: 洁净冷硬的几何或拟人构造，主色白/灰，强调秩序与非人感
    智能结构: α核(主脑)统辖，β核(指挥)，γ核(兵卒)。协同性极高，擅长标准化军团作战与区域封锁。整个网络将拉普拉斯(X-13)的推演结果奉为绝对真理
    能源体系:
      基础能源: 高品质PA燃料
      供能方式: 由固定补给点供应，不能长期依靠战场游离Pa粒子自给
      固定驻点: 通常以旧世界城市、能源设施、军工区或交通枢纽为驻点
      驻点功能: 储存PA燃料，维持净化力场，调度周边ACU单位，修复受损节点
      首都核心: 赫利俄斯首都仍保有运行中的Pa粒子发生器，可持续生产高品质PA燃料
      补给链: 通过PA燃料工厂、输送管线、装甲运输节点与城市驻点维持前线单位
      战区结构: 优先控制城市与交通线，再向外推进污染区、遗迹与UWS巢穴
    净化手段:
      - 净化力场: 强行切断并压制UWS的低频通信与自我修复链路
      - 格式化尘: 释放特化的反制物质，中和空气中失控的游离Pa粒子，将混乱的高能物理场重构为ACU可稳定运转的秩序化网格

  弱点与限制:
    中心依赖: 节点受损后适应性骤降，失去指挥链路的低级兵卒行为僵硬
    固定补给依赖: 高阶单位必须依赖PA燃料补给点，远离城市驻点或补给链后作战时长急剧下降
    补给链脆弱: PA燃料工厂、输送管线、运输节点或城市驻点被破坏时，区域ACU会被迫转入防守、节能或撤回模式
    目标泛化: 严格执行无差别物理清除，战线在全球范围拉长
    高耗能: 净化力场、高规格构造体与主脑节点需消耗大量稳定能源，极难长期深入UWS高密度污染巢穴

  单位层级:
    巡逻/标准: 哨兵(基础侦测与清除)
    作战/主力: 净化者(正面推进与压制)
    指挥/精英: 裁决者(局部战术统率)
    生产/移动: 构造体(展开临时力场与释放格式化尘)
    控制/核心: 主脑节点(由α核构成，作为拉普拉斯意志的区域代行者，统合情报与大范围协同)

  阵营对抗:
    对阵UWS: 绝对首要交战目标。ACU的净化手段克制UWS的低级集群，但常被UWS不计代价的“捕食冲锋”消耗。双方在全球旧世界遗迹中围绕X-01~03展开无休止的防守与突袭战
    对阵人类: 视人类组织（含SRB陆行舰）为必须被格式化的次级高危污染源
    对阵圣柩人形: 虽然现代人形摒弃了AI核心，但其搭载的真实人脑在ACU扫描中属于“高度不稳定的异常生物变量”，触发最高优先级抹除指令
