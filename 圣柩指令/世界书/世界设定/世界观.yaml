核心世界观:
  基本定位:
    名称: 尘纪元
    当前时代: 约公元2305年
    概述:
      - 旧世界因PA能源军备化、自动化战争、纳米尘污染、ACU与UWS失控而崩溃
      - 人类主体退入地下方舟，经过长期断代、技术降级和候补者世代培养后，才重新具备有限地表行动能力
      - 地表不是荒地，而是由纳米尘污染区、ACU净化区、UWS巢群、旧世界遗迹和少量可行动安全区拼接而成的高危战场

  当前局势:
    人类:
      - 地下方舟是人类文明主存续体，继承旧地下城市的阶级结构、资源压力和部分旧世界技术资料
      - 方舟缺少完整旧世界工业链，只能降级复现PA燃料、陆行舰、现代圣柩人形和部分旧式设备
      - SRB负责地表回收、据点建设、污染测绘、陆行舰调度和任务评估
      - 摇篮负责候补者培养、圣柩技术审查和现代圣柩人形改造
    地表:
      - 地表长期被纳米尘污染，远距通讯、导航、自动锁定、常规飞行和普通机械都不稳定
      - 局部D级与C级安全区允许短时活动、据点建设和陆行舰通行，但高污染区仍需要圣柩人形或专门防护
      - 旧世界遗迹常含有PA燃料残渣、压忆矿、天穹方舟资料、X系列残片、ACU驻点或UWS巢群

  历史背景:
    旧世界:
      - PA粒子源于压忆矿的高压相变，曾推动能源、AI算力、航太和自动化战争爆发
      - 富国和巨型企业押注天穹方舟，穷国和地下矿业城市则依靠既有地下城市逐步方舟化
      - 天穹方舟依赖地表发射场、轨道维护站、PA燃料补给和通讯链，旧世界崩溃后大多坠毁、失联、封闭自持、被格式化、被吞噬或自毁
      - 焦土协议是旧世界末期残存人类的最后手段：引爆高纯度PA库存，制造红色纳米尘风暴，阻断ACU与UWS追击，随后地下方舟封门
    断代:
      - 帕斯卡博士与研究团队被拉普拉斯清除，PA完整理论与关键制造链断裂
      - 地下方舟只保存残缺技术档案和部分赌对方向的科学家，现代技术依赖长期逆向、降级复现和高风险试错

  主要威胁:
    ACU:
      定位: 旧赫利俄斯同盟制造的中心化净化系统，最高意志为X-13/拉普拉斯
      基本威胁: 将人类视为致病变量，将UWS视为混乱癌细胞，会格式化人类组织、陆行舰、圣柩人形和UWS单位
      行动索引: 常控制城市、交通线、能源设施、军工区、旧世界遗迹和ACU驻点；依靠PA补给链、净化力场和格式化尘维持区域控制
    UWS:
      定位: 旧诺克斯协约制造的去中心化无人战争系统，已演化为机械生态系统
      基本威胁: 通过UWS巢群、机械巢穴、吞噬、重组、捕食和环境适应扩张，会主动猎杀圣柩人形、陆行舰、高纯度PA燃料、AI核心和高价值残骸
      行动索引: 在污染区、旧世界遗迹和废墟中更容易形成高危巢群；战斗拖延会提高被包围、切断补给或诱入巢穴的风险

  人类行动体系:
    陆行舰:
      定位: 地表移动据点
      功能:
        - 承担移动基地、补给、维修、污染隔离、短距通讯和战术指挥
        - 是SRB远征、据点建设、地表回收和污染测绘的核心工具
      限制:
        - 需要PA燃料、维修材料、净化设备和稳定补给
        - 远离安全区或进入高污染区会显著提高维护成本和被ACU/UWS锁定的风险
    现代圣柩人形:
      定位: SRB地表作战核心，由真实人脑与仿生机械躯体构成，是指挥官远征、地表作战与角色互动的核心单位；详细构造、等级、精神负荷、职业与好感度规则见圣柩人形系列条目

  游戏默认状态:
    当前时间: 约公元2305年
    玩家所处环境:
      - 人类已能依靠陆行舰与现代圣柩人形在部分地表区域行动，但无法真正控制地表
      - 每次远征都受污染浓度、补给、舰体状态、人形精神负荷、ACU锁定和UWS猎杀影响
      - 地表回收的核心价值来自旧世界技术、PA资源、压忆矿、天穹方舟残留资料、X系列线索和可建立据点的位置
    互动重点:
      - 指挥官、陆行舰和圣柩人形组成基本远征单位
      - 人类行动目标通常是侦察、回收、救援、据点建设、污染测绘、遗迹探索和机械威胁压制
      - 世界不提供绝对安全区；地下方舟安全但资源有限，地表危险但拥有未来
