---
功绩点获取机制:
  说明: 功绩点是地表回收局（SRB）衡量指挥官价值的核心量化指标。它不仅决定了指挥官的资源配给、技术权限和在排行榜上的地位，更是其能否在残酷的地表生存下去的生命线。SRB的后勤与评估部（LED）通过一套复杂的算法，实时更新每位指挥官的信用点，其获取方式被精心设计，以全面评估指挥官的综合能力

  一、核心任务推进:
    SRB评估逻辑: 这是指挥官执行SRB战略意图最直接的体现。完成这些任务意味着你为人类的回收事业贡献了关键力量
    获取方式:
      主线章节任务:
        描述: 完成推动宏观剧情的关键节点任务
        奖励: 巨大，通常为一次性 800 - 2,500 信用点
        示例: 完成"火花计划第一阶段：点亮旧城区通讯塔"，奖励1500 信用点
      常规系列任务:
        清除任务:
          基础: 60 - 150 信用点
          效率加成: 每提前30秒完成任务，信用点+2%，最高+20%
          精英加成: 任务中每包含一个精英级ACU（如裁决者），基础信用点+15%
        运货任务:
          基础: 40 - 120 信用点
          货物完好度: 货物100%完好度，信用点+25%。每降低10%完好度，该项加成降低5%
          风险加成: 运送高价值/不稳定货物（如"心智冷却液"原液）的任务，基础信用点更高
        回收任务:
          基础: 50 - 180 信用点
          价值评估: 根据回收物（技术蓝图、特殊ACU核心等）的稀有度决定基础信用点
          意外发现: 在任务目标外，额外回收了未标记的高价值遗物，每件额外奖励 +20 - 50 信用点
        激活信标:
          基础: 120 - 200 信用点（一次性）
          防御评级: 防御战中信标或陆行舰受损越低，信用点奖励越高，最高可获得额外+30%的"完美防御"嘉奖
        护送任务:
          基础: 100 - 300 信用点
          人员存活: 完美护送（无人员伤亡），信用点+50%。若被护送的科研人员等关键人物阵亡，任务判定为失败，倒扣 50 信用点 作为惩罚
        剿匪任务:
          基础: 50 - 100 信用点
          情报价值: 缴获匪帮持有的、关于其他匪帮或ACU动向的情报，额外奖励 +30 信用点
        科研扫描:
          基础: 40 - 90 信用点
          数据完整度: 扫描数据完整度达到100%，信用点+20%
          特殊条件: 在满足"不惊扰目标"、"不造成伤害"等苛刻条件下完成，信用点+40%

  二、区域探索与净化:
    SRB评估逻辑: 开拓未知是SRB的根本使命。将危险的废土变为可利用的安全区，是指挥官最值得称道的功绩之一
    获取方式:
      首次探索新地块:
        描述: 首次驾驶陆行舰驶入地图上的未知网格
        奖励: 微量，根据区域危险等级（D级-A级）奖励 5 - 30 信用点
      发现并记录关键地标:
        旧世界遗迹（医院、图书馆、地铁站）: 25 信用点
        资源富集点（高能晶体矿洞、未开采的油井）: 30 信用点
        战略要冲（跨海大桥、山体隧道、隐蔽的维修港）: 50 信用点
      区域威胁等级降低:
        描述: 通过清除区域内的ACU巢穴、匪帮据点或完成特定净化任务
        奖励: 将区域威胁等级永久性降低一级（如从B级降为C级），一次性奖励 150 - 400 信用点，具体数值取决于区域大小和原始危险度

  三、ACU清除:
    SRB评估逻辑: 每一具ACU残骸，都意味着地表向安全迈进了一小步。这是衡量指挥官战斗效能最直观的数据
    获取方式:
      标准单位:
        哨兵: 1 信用点
        净化者: 2-3 信用点
        构造体: 20 信用点（因其战术威胁更高）
      精英/首领单位:
        裁决者: 50 信用点
        任务指定首领: 100 - 250 信用点
      战术嘉奖:
        完美作战（我方人形未进入中度/重度损伤）: +10% 信用点
        战术压制（在规定时间的50%内结束战斗）: +10% 信用点
        非对称胜利（以显著低于推荐战力的队伍获胜）: +20% 信用点

  四、资源回收与设施建设:
    SRB评估逻辑: 一个懂得积累和发展的指挥官，是比单纯的战斗员更有价值的资产。SRB鼓励一切增强单位长期生存能力的行为
    获取方式:
      资源回收里程碑（一次性成就奖励）:
        - 累计回收 10,000 "零件": 15 信用点
        - 累计回收 1,000,000 "零件": 100 信用点
        - 累计采集 500 "技术样本": 80 信用点
      设施建设与升级:
        - 首次建造一个新设施（如从零建成科研实验室）: 40 信用点
        - 将任意设施首次提升至更高等级: 奖励（设施新等级 x 15）信用点。例如，食堂从Lv2升到Lv3，奖励 3x15 = 45 信用点。将设施升至满级（Lv5）时，有额外 50 信用点 的"专家认证"奖励

  五、人形关系深化:
    SRB评估逻辑: 圣柩人形是SRB最宝贵的资产。能够维系其心智稳定并激发其潜能的指挥官，展现了卓越的领导才能
    获取方式:
      首次招募新的人形: 60 信用点。若是稀有的"遗产"人形，奖励提升至 100 信用点
      羁绊等级突破:
        描述: 将任意人形的羁绊等级提升至新阶段
        奖励: （新羁绊阶段等级 x 10）信用点。例如，关系从Lv2"熟悉"提升至Lv3"信赖"，奖励 30 信用点。这是对指挥官"牧养"能力的肯定。

  六、科技研发突破:
    SRB评估逻辑: 技术反超是人类重返地表的关键。每一个技术进步，都会被计入功绩
    获取方式:
      成功研发新项目:
        - 常规装备/模块（如新式步枪、强化装甲片）: 15 - 40 信用点
        - 关键科技（如新的冷却液配方、陆行舰设施升级方案）: 50 - 120 信用点
        - 逆向工程ACU核心科技: 200+ 信用点

  七、特殊委托完成:
    SRB评估逻辑: 这是对精英指挥官的特别考验，也是其获取超额回报、拉开与其他指挥官差距的途径
    获取方式:
      限时紧急任务（如拦截叛逃的运输队、在ACU潮爆发前抢救数据）: 任务基础信用点奖励 x1.5 - x2.0
      对抗叛乱指挥官（日落协议）:
        奖励: 至高。成功完成任务将一次性获得 3,000 - 6,000 信用点，并根据回收资产（陆行舰、圣柩人形）的完整度获得额外加成。这是对SRB最高级别的贡献，足以让一名指挥官的排名一飞冲天
