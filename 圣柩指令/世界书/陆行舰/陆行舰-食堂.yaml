食堂 设施阶段:

配给站 (等级 1):
  餐食功能:
    - 仅能提供维持生命体征的基础能量。
    - 长期食用会导致人形精神负荷缓慢增加，影响士气。

改良配给区 (等级 2):
  餐食功能:
    - 营养膏的口味选择在一定程度上缓解了单调感。
    - 净水器的存在让大家不必再喝带有金属味的循环水，对士气有微小的正面影响。

简易厨房 (等级 3):
  餐食功能:
    - 解锁基础烹饪功能。可制作简单的料理，有效提升士气，并能为人形提供短暂的正面状态加成。
    - 偶尔会产出黑暗料理，带来一些有趣的负面效果。

自动化供餐中心 (等级 4):
  餐食功能:
    - 自动化系统内置大量菜谱，大大降低了烹饪门槛，保证了菜品的下限。
    - 可稳定地为全员提供能带来中等增益效果的美味佳肴。
    - 解锁食材分析功能，可分析未知食材的营养成分和潜在风险。

多功能餐厅 (等级 5):
  餐食功能:
    - 拥有丰富的食材库，可制作各种美食，显著提升全员士气，并提供强力的长时间增益效果。
    - 解锁回忆之味系统，通过分析特殊遗物，可重现旧世界的特定食物，触发特定人形的个人专属剧情。
