指挥官的房间 设施阶段:

临时隔间 (等级 1):
  功能性:
    - 仅提供睡眠和处理文书的功能。

标准单间 (等级 2):
  功能性:
    - 办公桌上配备性能更好的终端，处理公务效率提升。
    - 衣柜的存在让指挥官可存放非战斗用便服。

私人书房 (等级 3):
  功能性:
    - 增加个人终端和资料库功能，可查阅更详细的人形资料、过往战斗录像、解锁的背景信息。
    - 书架成为存放和展示礼物的地方。

多功能套房 (等级 4):
  功能性:
    - 划分为独立卧室和工作区。工作区配备战术分析板和通讯设备，可直接链接舰桥主系统处理紧急事务。
    - 卧室配备高品质床品和香薰机，保证最佳休息质量。

心灵港湾 (等级 5):
  功能性:
    - 解锁个人剧情回顾系统，可重温与每一位人形经历的关键事件。
    - 配备高品质音响和咖啡机。
    - 拥有独立空气循环和环境模拟系统，可调节室内光照与温度。
