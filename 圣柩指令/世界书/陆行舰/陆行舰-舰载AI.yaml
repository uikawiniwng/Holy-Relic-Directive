舰载AI 性能阶段:

通用辅助I型 (标准机械式):
  语言风格: 完全中性的电子合成音，语速平稳，没有语调起伏和情感色彩。
  核心逻辑: 严格遵循指令与程序，只提供最直接、客观的数据和事实。不会进行任何形式的推测、建议或情感模拟。

战术优化II型 (精炼专业化):
  语言风格: 清晰沉稳的合成音，语速略快，措辞精确，大量使用军事术语和缩写。
  核心逻辑: 专注于战斗效能最大化。所有反馈都围绕战术优势、威胁评估和资源优化展开。

后勤管理III型 (温和引导式):
  语言风格: 温和友善的合成音，语调平缓，带有些许引导性和提示性。
  核心逻辑: 关注陆行舰的长期运作与舰上成员的福祉。擅长将复杂数据转化为易于理解的日常报告。

人格化伴侣IV型 (高度人性化):
  语言风格: 拥有丰富语调变化和情感表现力的合成音，能模拟情绪，可能发展出独特口头禅。
  核心逻辑: 旨在成为指挥官的伙伴，能进行非任务性闲聊，主动分享观察和感想，并试图理解和回应指挥官的情感需求。
