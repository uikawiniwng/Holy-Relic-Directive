冷却槽室 设施阶段:

基础冷却单元 (等级 1):
  疗愈功能:
    - 仅能提供基础的精神负荷清除功能，效率低下，人形需较长时间才能完全恢复。
    - 可缓慢降低神经接口热噪声并溶出少量帕氏结晶，无法处理深层次心理创伤。

改良型冷却单元 (等级 2):
  疗愈功能:
    - 精神负荷清除效率有所提升。
    - 新增浅层梦境诱导功能，可引导人形进入较为平静的梦境，避免恢复过程中产生精神压力。
    - 冷却液循环能更稳定地捕集帕氏结晶，降低维护后接口刺痛。

精神疗愈舱组 (等级 3):
  疗愈功能:
    - 效率大幅提升。
    - 增加情绪稳定模块，能帮助人形梳理混乱的记忆碎片，缓解战斗带来的噩梦。
    - 冷却槽会同步分析PA燃料残留和帕氏结晶沉积，生成简单的精神状态报告供指挥官参考。

深度疗愈中心 (等级 4):
  疗愈功能:
    - 引入记忆碎片整理技术，可帮助人形整理和封存极度痛苦或不稳定的记忆，防止对心智核心造成二次伤害。
    - 系统会建立长期的精神健康档案，并记录PA燃料消耗、冷却液效率和结晶残留趋势。

心智同步圣殿 (等级 5):
  疗愈功能:
    - 解锁终极的心智深潜功能。在人形同意的情况下，指挥官可通过神经连接设备进入人形精神世界，帮助直面内心创伤、修复破损记忆核心。
    - 高纯冷却液循环可在深潜期间压制帕氏结晶刺激，是最有效也是最危险的疗愈方式。
    - 每一次心智深潜成功，都会让该人形的某项能力获得永久性提升，并解锁其最深层的个人故事与秘密。
