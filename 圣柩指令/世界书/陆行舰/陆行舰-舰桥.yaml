舰桥 设施阶段:

基础舰桥 (等级 1):
  指挥功能:
    - 仅能满足最基本的战术指挥、路线规划和资源监控。
    - 与SRB的通讯信道狭窄，常伴有大量杂音，获取信息效率低下。

改进型舰桥 (等级 2):
  指挥功能:
    - 通讯信道稳定性提升，能够维持短时间的清晰语音通讯。
    - 舰载AI获得基础威胁评估能力，能在地图上以不同颜色标记出潜在危险区域。

强化舰桥 (等级 3):
  指挥功能:
    - 新增战术辅助分析模块，可根据战场数据对敌方动向进行初步预测。
    - 通讯系统升级，能过滤大部分干扰，接收到更多来自其他指挥官的公共频段信息。

综合指挥平台 (等级 4):
  指挥功能:
    - 能够同时指挥多支人形小队执行协同任务。
    - 解锁对仿生侦察单位的直接控制权限。
    - 通讯系统能够接入SRB的区域性战术网络。
    - 舰载AI具备初步战场态势评估能力，能高亮显示最具威胁的目标和最佳进攻路线。

指挥中心 (等级 5):
  指挥功能:
    - 解锁战略级指挥权限，包括向SRB申请小范围火力支援、进行大范围战略情报扫描。
    - 通讯模块直接接入深链网络的次级端口，能够接收到加密的战略简报。
    - 舰载AI升级为拥有高级辅助决策逻辑的战术参谋AI，能在指挥官决策时提供多种备选方案及其成功率预测。大部分常规操作已完全自动化。
