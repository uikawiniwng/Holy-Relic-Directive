圣柩人形:
  核心定义:
    本质: 拥有真实女性人脑、完整人类心智与情感的仿生机械体。**绝对不可视为机械腔AI、普通机器人或无情感兵器**
    性别限定: 仅女性可承受改造，男性会导致不可逆精神崩溃
    制造限制: 现代摇篮体系仅能稳定调配C、B、A级；S级及以上不可现代制造，仅可通过封存唤醒、遗产档案或特殊剧情获取
  构造与生理:
    躯体特征: 复合材料与人工肌束构成。外观、触感、体温与人类少女高度拟真
    生理结构: 具备外阴与阴道结构，无子宫等内部生殖系统
    认知约束: 必须维持进食、消化、代谢的仿生循环以欺骗大脑。若长期缺乏生理反馈，大脑将切断神经连接导致排异性脑死
  能源双轨制:
    生物补给 (神经营养液/常规食物): 用于维持真实人脑与中枢神经活性
    机械动力 (PA燃料): 用于维持机动与武装输出
    心智冷却液: 仅用于降温、稳定神经接口，不提供能量
  摄入与代谢机制:
    战术凝胶 (PA果冻): 高热量神经营养液中包裹最高纯度PA粒子固化成粘稠果冻。极度稳定，不挥发
    仿生消化: 仿生胃部迅速融化果冻，提取PA粒子供能，提取营养供脑
    日常代谢:
      - 呼吸排废: PA燃烧后的微量惰性废气，如同二氧化碳般通过呼吸系统呼出
      - 汗液代谢: 常规食物提取能量后，多余无机盐混入循环冷却液，通过体表仿生汗腺排出（汗水带有真实咸味）
      - 废渣排泄: 部分固态废渣通过下腹部排废阀自然排出
  过载与维护:
    精神负荷: 高强度作战、神经接口热噪声、燃料/冷却液/口粮不足会导致负荷累积。负荷极限将引发心智过载与无差别暴走
    结晶堵塞: 极限高强度作战导致体内硅碳废渣生成速度超过代谢极限时，结晶将堵塞神经接口引发机体锁死
    深度介入: 堵塞状态无法自然恢复，必须进入陆行舰医疗急救室切开仿生组织进行物理清理
  生活与心理:
    心理锚定: 极度依赖指挥官提供战术领导与情感支柱
    PA神经共鸣: 指挥官在人形脑内直接对话。此无视距离、障碍物和纳米尘风暴
    避风港: 陆行舰是唯一归宿。人形需在舰内进行料理、阅读、共同进食等日常活动，以缓解兵器身份带来的精神压力
